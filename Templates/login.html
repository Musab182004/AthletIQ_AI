<!DOCTYPE html>
<html>
<head>
    <title>AthletIQ - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="#" class="logo">AthletIQ</a>
            <div class="nav-links">
                <a href="/login" class="active">Login</a>
                <a href="/signup">Signup</a>
            </div>
        </div>
    </nav>

    <section class="section-padding">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    
                    <div class="at-card border-success">
                        <h1>Welcome Back</h1>
                        <p class="para1">Login to your AthletIQ Dashboard</p>
                        
                        <form method="POST" action="/login">
                            <input type="email" name="email" placeholder="Enter Email" required>
                            <input type="password" name="password" placeholder="Enter Password" required>
                            <button type="submit" class="btn-at btn-at-success">Login</button>
                        </form>
                        
                        <p style="margin-top: 20px; text-align: center; font-size: 14px;">
                            New to AthletIQ? <a href="/signup" style="color: #3b82f6; display: inline;">Signup here</a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </section>

</body>
</html>
