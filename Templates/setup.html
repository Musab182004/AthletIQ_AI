<!DOCTYPE html>
<html>
<head>
    <title>AthletIQ - Setup Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="#" class="logo">AthletIQ</a>
            <span class="sub-title" style="font-size: 14px;">Profile Deployment</span>
        </div>
    </nav>

    <section class="section-padding">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="at-card border-primary">
                        <h1>Configure Profile</h1>
                        <p class="para1">Input metrics to calibrate your BMR calorie engine multipliers.</p>
                        <form method="POST" action="/setup">
                            <label style="color: #cbd5e1; margin-bottom: 5px; display: block;">Full Name</label>
                            <input type="text" name="name" placeholder="Enter Full Name" required>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <label style="color: #cbd5e1; margin-bottom: 5px; display: block;">Age (Years)</label>
                                    <input type="number" name="age" placeholder="e.g. 22" required>
                                </div>
                                <div class="col-md-6">
                                    <label style="color: #cbd5e1; margin-bottom: 5px; display: block;">Height (cm)</label>
                                    <input type="number" name="height" placeholder="e.g. 175" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <label style="color: #cbd5e1; margin-bottom: 5px; display: block;">Current Weight (kg)</label>
                                    <input type="number" step="0.1" name="weight" placeholder="e.g. 75" required>
                                </div>
                                <div class="col-md-6">
                                    <label style="color: #cbd5e1; margin-bottom: 5px; display: block;">Target Weight (kg)</label>
                                    <input type="number" step="0.1" name="target_weight" placeholder="e.g. 82" required>
                                </div>
                            </div>

                            <label style="color: #cbd5e1; margin-bottom: 5px; display: block;">Weekly Activity Level</label>
                            <select name="activity_level">
                                <option value="sedentary">Sedentary (Little or no exercise)</option>
                                <option value="lightly_active">Lightly Active (Exercise 1-3 days/week)</option>
                                <option value="moderately_active" selected>Moderately Active (Exercise 3-5 days/week)</option>
                                <option value="very_active">Very Active (Hard exercise 6-7 days/week)</option>
                            </select>

                            <label style="color: #cbd5e1; margin-bottom: 5px; display: block;">Primary Target Goal</label>
                            <select name="goal">
                                <option value="bulk">Bulk Mode (+ Calories Addition)</option>
                                <option value="cut">Cut Mode (- Deficit Subtraction)</option>
                                <option value="maintenance">Maintenance (Stay Stable)</option>
                            </select>

                            <button type="submit" class="btn-at btn-at-primary" style="width:100%; margin-top: 15px;">Initialize Engine</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
