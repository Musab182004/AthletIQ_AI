<!DOCTYPE html>
<html>
<head>
    <title>AthletIQ - Signup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="#" class="logo">AthletIQ</a>
            <div class="nav-links">
                <a href="/login">Login</a>
                <a href="/signup" class="active">Signup</a>
            </div>
        </div>
    </nav>

    <section class="section-padding">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    
                    <div class="at-card border-primary">
                        <h1>Create Account</h1>
                        <p class="para1">Join AthletIQ Fitness Journey</p>
                        
                        <form method="POST" action="/signup">
                            <input type="email" name="email" placeholder="Enter Email" required>
                            <input type="password" name="password" placeholder="Create Password" required>
                            <button type="submit" class="btn-at btn-at-primary" style="width: 100%;">Sign Up</button>
                        </form>
                        
                        <p style="margin-top: 20px; text-align: center; font-size: 14px;">
                            Already have an account? <a href="/login" style="color: #3b82f6; display: inline;">Login here</a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </section>

</body>
</html>
